<script>
function buscarColeccion() {
    const input = document.getElementById('inputBusqueda').value.toLowerCase();
    const colecciones = document.querySelectorAll('.seccionColeccion');

    colecciones.forEach(seccion => {
        // 1. Buscamos en la información de la sección (Colección y Título H2)
        const nombreColeccion = seccion.getAttribute('data-coleccion').toLowerCase();
        const textoTitulo = seccion.querySelector('.tituloColeccion h2').textContent.toLowerCase();
        
        // 2. Buscamos en los nombres de todos los productos (muñecos) dentro de esta sección
        const productos = seccion.querySelectorAll('.nombreProducto');
        let productoEncontrado = false;
        
        productos.forEach(prod => {
            if (prod.textContent.toLowerCase().includes(input)) {
                productoEncontrado = true;
            }
        });

        // 3. Si el input coincide con la colección, el título o ALGÚN producto, mostramos la sección
        if (nombreColeccion.includes(input) || textoTitulo.includes(input) || productoEncontrado) {
            seccion.style.display = 'flex';
            
            // Opcional: Si buscas un producto, puedes ocultar los que no coinciden DENTRO de la grilla
            // (Si prefieres que se oculte toda la colección, no toques esto)
        } else {
            seccion.style.display = 'none';
        }
    });
}
</script>
